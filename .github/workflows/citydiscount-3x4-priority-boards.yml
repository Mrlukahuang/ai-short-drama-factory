name: CityDiscount original mascot 3x4 priority boards (offline)

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/render_citydiscount_3x4_priority_boards.py
      - tests/test_citydiscount_3x4_priority_boards.py
      - .github/workflows/citydiscount-3x4-priority-boards.yml
  push:
    branches: [main]
    paths:
      - scripts/render_citydiscount_3x4_priority_boards.py
      - .github/workflows/citydiscount-3x4-priority-boards.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  review-selected-scenes:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DRAMA_ENABLE_PAID_GENERATION: 'NO'
      DRAMA_FACTORY_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline image renderer and readable Chinese font
        run: |
          python -m pip install 'pillow>=11,<13'
          if [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Render ONLY s02 s05 s06 s07 and genuine official s12 Logo (no media uploads)
        run: |
          python scripts/render_citydiscount_3x4_priority_boards.py \
            --out artifacts/citydiscount-3x4-priority
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          p=Path('artifacts/citydiscount-3x4-priority')
          r=json.loads((p/'receipt.json').read_text('utf-8'))
          assert r['owner_selection']==['s02','s05','s06','s07','s12']
          assert r['target_pixel_size']==[1080,1440]
          assert r['new_paid_calls']==0 and r['model_submission_allowed'] is False
          assert r['sprite_eyes_not_modified'] is True
          assert len(r['frames'])==9
          for f in p.glob('*.png'):
            with Image.open(f) as im:
              assert im.size==(1080,1440)
          assert (p/'citydiscount_priority_5_scenes_contact.jpg').is_file()
          PY
      - name: Upload genuine mascot/Logo review assets, never production-ready
        uses: actions/upload-artifact@v4
        with:
          name: CityDiscount-original-mascot-1080x1440-selected-02-05-06-07-12-NOT-FINAL
          path: |
            artifacts/citydiscount-3x4-priority/*.png
            artifacts/citydiscount-3x4-priority/citydiscount_priority_5_scenes_contact.jpg
            artifacts/citydiscount-3x4-priority/receipt.json
          retention-days: 7
          if-no-files-found: error
