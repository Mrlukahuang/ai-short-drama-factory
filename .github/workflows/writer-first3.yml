name: Writer first3 text compatibility (manual, USD2 total)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_WRITER_FIRST3_USD2 (one-time, no reruns)
        required: true
        type: string
      reported_spend_today_usd:
        description: Verified total API USD already spent today (Pacific/Auckland)
        required: true
        type: string

permissions:
  contents: read
  issues: write
concurrency:
  group: writer-first3-owner-20261018
  cancel-in-progress: false

jobs:
  first3:
    if: ${{ inputs.confirmation == 'RUN_WRITER_FIRST3_USD2' && github.actor == 'Mrlukahuang' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and offline tests (no media SDK)
        run: python -m pip install -e '.[test]'
      - name: Verify offline adapters and pilot gates before credentials
        run: python -m pytest -q tests/test_writer_execution_prep.py tests/test_writer_pilot.py
      - name: First three text attempts only, no automatic retry
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          WRITER_PILOT_CONFIRM: ${{ inputs.confirmation }}
          REPORTED_SPEND: ${{ inputs.reported_spend_today_usd }}
        run: python scripts/run_writer_pilot.py --paid --reported-spend-today-usd "$REPORTED_SPEND"
      - name: Preserve private outputs and incomplete receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: writer-first3-${{ github.run_id }}
          path: artifacts/writer-first3/
          if-no-files-found: warn
          retention-days: 14
