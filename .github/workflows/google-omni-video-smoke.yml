name: Google Omni one-video to episode (manual, may incur cost)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "GENERATE_ONE_PAID_VIDEO (charged) or RECOVER_EXISTING_VIDEO (download only)"
        required: true
        type: string
      recovery_file_id:
        description: "Only for RECOVER_EXISTING_VIDEO: file ID from private recovery artifact"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: manual-google-omni-video-once
  cancel-in-progress: false

jobs:
  omni-video-smoke:
    if: ${{ inputs.confirmation == 'GENERATE_ONE_PAID_VIDEO' || inputs.confirmation == 'RECOVER_EXISTING_VIDEO' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Install SDK and offline composer
        run: python -m pip install -e '.[test,google-video]'
      - name: Validate repository secret (never print)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          if [[ -z "${GEMINI_API_KEY}" ]]; then
            echo "::error::GEMINI_API_KEY secret missing"
            exit 1
          fi
      - name: Request ONE potentially paid Omni video and compose MP4
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRAMA_ENABLE_PAID_GENERATION: ${{ inputs.confirmation == 'GENERATE_ONE_PAID_VIDEO' && 'YES' || 'NO' }}
          CONFIRMATION: ${{ inputs.confirmation }}
          RECOVERY_FILE_ID: ${{ inputs.recovery_file_id }}
        run: |
          if [[ "${CONFIRMATION}" == "GENERATE_ONE_PAID_VIDEO" ]]; then
            python -m drama_factory.providers.omni_video_smoke --paid --out artifacts/omni-video-smoke
          elif [[ "${CONFIRMATION}" == "RECOVER_EXISTING_VIDEO" ]]; then
            test -n "${RECOVERY_FILE_ID}" || { echo "::error::recovery_file_id required"; exit 1; }
            python -m drama_factory.providers.omni_video_smoke --resume-file-id "${RECOVERY_FILE_ID}" --out artifacts/omni-video-smoke
          else
            echo "::error::invalid confirmation"; exit 1
          fi
      - name: Inspect generated clip and assembled episode
        run: |
          test -s artifacts/omni-video-smoke/omni_raw.mp4
          test -s artifacts/omni-video-smoke/demo.mp4
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name -of json artifacts/omni-video-smoke/demo.mp4
      - name: Upload original Omni clip and composed six-second episode
        uses: actions/upload-artifact@v4
        with:
          name: omni-real-clip-and-composed-episode
          path: |
            artifacts/omni-video-smoke/omni_raw.mp4
            artifacts/omni-video-smoke/demo.mp4
            artifacts/omni-video-smoke/manifest.json
          retention-days: 3
          if-no-files-found: error

      - name: Keep recovery-only receipt even if postprocessing fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-video-recovery-receipt
          path: artifacts/omni-video-smoke/omni_raw.recovery.json
          retention-days: 3
          if-no-files-found: ignore
