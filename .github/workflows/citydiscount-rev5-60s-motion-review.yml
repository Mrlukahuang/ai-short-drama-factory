name: CityDiscount rev5 60s S03+S04 genuine wool plate continuity A/B ($0)
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/build_citydiscount_rev5_60s_moving_previs.py
      - scripts/citydiscount_3d_diorama.py
      - scripts/citydiscount_street_motion.py
      - scripts/citydiscount_volumetric_lamb.py
      - scripts/citydiscount_city_to_globe_bridge.py
      - scripts/citydiscount_visual_contact_sheet.py
      - tests/test_citydiscount_rev5_60s_moving_previs.py
      - .github/workflows/citydiscount-rev5-60s-motion-review.yml
  push:
    branches: [main]
    paths:
      - scripts/build_citydiscount_rev5_60s_moving_previs.py
      - scripts/citydiscount_3d_diorama.py
      - scripts/citydiscount_street_motion.py
      - scripts/citydiscount_volumetric_lamb.py
      - scripts/citydiscount_city_to_globe_bridge.py
      - scripts/citydiscount_visual_contact_sheet.py
      - .github/workflows/citydiscount-rev5-60s-motion-review.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  rev5-moving-storyboard:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    env:
      DRAMA_ENABLE_PAID_GENERATION: 'NO'
      DRAMA_FACTORY_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install ONLY local image/audio/FFmpeg tools (no model SDK)
        run: |
          python -m pip install 'pillow>=11,<13'
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          if [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Reuse previous REAL 60s rev4 technical cut (original exact SHA)
        uses: actions/download-artifact@v4
        with:
          name: CityDiscount-rev4-60s-1080x1440-existing-2-real-shots-TECHNICAL-NOT-FINAL
          run-id: 39706186718
          github-token: ${{ github.token }}
          path: artifacts/previous-rev4
      - name: Reuse canonical OFFICIAL Logo 5s globe endcard (exact SHA)
        uses: actions/download-artifact@v4
        with:
          name: CityDiscount-rev5-owner-globe-to-official-logo-5s-ENDCARD-NOT-FINAL
          run-id: 39709324093
          github-token: ${{ github.token }}
          path: artifacts/previous-endcard
      - name: Reuse exact SHA-verified local sign redaction of existing REAL Omni s05
        uses: actions/download-artifact@v4
        with:
          name: CityDiscount-s05-REAL-OMNI-SIGN-REDACTED-5s-REVIEW-NOT-FINAL
          run-id: 39747140543
          github-token: ${{ github.token }}
          path: artifacts/clean-s05
      - name: Reuse historical REAL Omni s03 felt-Auckland city-only original, SHA pinned
        uses: actions/download-artifact@v4
        with:
          name: citydiscount-s03-city-plate-not-final-episode
          run-id: 39441034483
          github-token: ${{ github.token }}
          path: artifacts/real-city-s03
      - name: Produce 12x5s true projected XYZ city camera-previsualization with historic real lamb shots
        run: |
          python scripts/build_citydiscount_rev5_60s_moving_previs.py \
            --rev4 artifacts/previous-rev4/CityDiscount_rev4_60s_3x4_TECHNICAL_NOT_FINAL.mp4 \
            --end artifacts/previous-endcard/CityDiscount_rev5_felt_globe_into_official_logo_5s_PREVIS_NOT_FINAL.mp4 \
            --s05-clean artifacts/clean-s05/CityDiscount_s05_REAL_OMNI_BANNER_REDACTED_5s_NOT_FINAL.mp4 \
            --s03-city artifacts/real-city-s03/s03-real/s03_city_plate.mp4 \
            --s04-same-real-plate \
            --out artifacts/cd-rev5-60s
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("artifacts/cd-rev5-60s")
          r=json.loads((p/"receipt.json").read_text("utf-8"))
          assert r["schema"]=="g4-citydiscount-rev5-moving-camera-60s-previs.v1"
          assert r["closing_copy"]=="都市折扣🌟，您的省钱助手小羊薅薅。"
          assert r["resolution"]==[1080,1440] and r["shot_count"]==12
          assert 59.9 <= r["duration_seconds"] <= 60.2
          assert r["existing_real_AI_lamb_shots"]==["s02","s05"]
          assert r["s03_genuine_existing_omni_environment_in_60s"] is True
          assert r["s03_real_source_sha256"]=="b718e6b0a6e5a64db66d74e6b1364326d16671823fca12935e8a3667b101af3f"
          assert r["s03_original_camera_crane_out_retimed_in_reverse"] is True
          assert r["s03_native_9by16_nonstretched_reframe"] is True
          assert r["s03_has_original_mascot_performance"] is False
          assert r["s03_s04_unbroken_real_world_camera_verified"] is False
          assert r["s04_same_original_real_city_frame_followup"] is True
          assert r["s04_last_s03_frame_local_digital_push_only"] is True
          assert r["s04_genuine_new_ai_character_performance"] is False
          assert r["s04_genuine_3d_parallax_camera_motion"] is False
          assert r["s04_sharp_zoompanning_limited_to_1point5x"] is True
          assert r["s04_original_program_city_unmodified_in_default_cut"] is False
          assert r["provenance"][3]["kind"]=="LOCAL_ZOOMPAN_OF_HISTORICAL_REAL_OMNI_CITY_S03_FRAME_NOT_NEW_REAL_SHOT"
          assert "s04" not in r["scene_camera_3d_geometry_previs"]
          assert r["real_model_generated_shots_added_in_this_run"]==0
          assert r["provenance"][2]["kind"]=="EXISTING_REAL_OMNI_AUCKLAND_ENVIRONMENT_REVERSE_CAMERA_NOT_CHARACTER"
          assert r["s05_redacted_review_input_sha256"]=="7a4a7e5f261a641dd7035698a5aad3a9a331bf51a70c5ccd7565677a2694a652"
          assert r["s05_shop_sign_hallucination_removed_in_cut"] is True
          assert r["s05_native_9by16_reframed_without_stretch"] is True
          assert r["s05_clean_reuses_existing_omni_not_new_ai"] is True
          assert r["s05_coin_exact_design_approved"] is False
          assert r["s05_two_digs_owner_verified"] is False
          assert r["procedural_3d_scene_rendered"] is True
          assert r["sheep_actor_is_billed_3d_rigged"] is False
          assert r["original_sheep_2d_billboard_in_xyz_city"] is True
          assert r["street_routes_use_continuous_xyz_grid"] is True
          assert r["camera_keys_match_across_non_paid_cuts"] is True
          assert r["sheep_bounded_2d_gait_bob_and_footstep_pass"] is True
          assert r["sheep_is_original_billboard_not_3d_rigged"] is True
          assert r["hybrid_lamb_projected_3d_wool_body_and_four_gait_legs"] is True
          assert r["owner_source_face_rgba_unmodified_except_crop_resize_tilt"] is True
          assert r["hybrid_lamb_owner_3d_identity_approval"] is False
          assert r["family_cast_is_provisional_xyz_wool_placeholder"] is True
          assert r["near_actor_dollhouse_roof_cutaway_rendered"] is True
          assert r["visual_aesthetic_owner_approval"] is None
          assert r["planetary_full_3d_camera_animation_pass"] is False
          assert r["city_xyz_to_felt_globe_source_bridge"]["logo_hold_seconds"] >= 3.0
          assert r["city_xyz_to_felt_globe_source_bridge"]["genuine_planetary_3d_cinematic_camera"] is False
          assert r["genuine_aerial_to_street_3D_camera_pass"] is False
          assert r["genuine_sheep_travel_world_zoom_pass"] is False
          assert r["true_complete_12shot_AI_film"] is False
          assert r["no_new_paid_model_calls"] is True
          assert r["publish_approved"] is False and r["g4_exit"] is False
          assert len(r["provenance"])==12
          assert (p/"CityDiscount_rev5_60s_CINEMATIC_CAMERA_PREVIS_NOT_FINAL.mp4").is_file()
          PY
      - name: Audit final H264/AAC frames and create actual 12-scene review sheet
        run: |
          python scripts/citydiscount_visual_contact_sheet.py \
            --video artifacts/cd-rev5-60s/CityDiscount_rev5_60s_CINEMATIC_CAMERA_PREVIS_NOT_FINAL.mp4 \
            --receipt artifacts/cd-rev5-60s/receipt.json \
            --out artifacts/cd-rev5-60s/CONTACT_SHEET_12_SHOTS.png
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/cd-rev5-60s")
          x=json.loads((root/"visual_review.json").read_text())
          assert len(x["sampled_real_output_frames"])==12
          assert [a["shot_id"] for a in x["sampled_real_output_frames"]]==[f"s{i:02d}" for i in range(1,13)]
          assert x["visual_quality_pass"] is None
          assert x["owner_character_design_pass"] is None
          assert x["approved_for_release"] is False
          assert x["additional_paid_provider_calls"]==0
          assert (root/"CONTACT_SHEET_12_SHOTS.png").stat().st_size>20000
          PY
      - name: Upload one actual 60s MP4 and receipt (no raw original video files)
        uses: actions/upload-artifact@v4
        with:
          name: CityDiscount-rev5-60s-S03-S04-SAME-REAL-WOOL-PLATE-DIGITAL-PUSH-AB-NOT-FINAL
          path: |
            artifacts/cd-rev5-60s/CityDiscount_rev5_60s_CINEMATIC_CAMERA_PREVIS_NOT_FINAL.mp4
            artifacts/cd-rev5-60s/receipt.json
            artifacts/cd-rev5-60s/CONTACT_SHEET_12_SHOTS.png
            artifacts/cd-rev5-60s/visual_review.json
          retention-days: 7
          if-no-files-found: error
