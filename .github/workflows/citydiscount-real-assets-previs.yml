name: CityDiscount 60s real-assets offline animatic
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/render_citydiscount_branded_previs.py
      - tests/test_citydiscount_branded_previs.py
      - .github/workflows/citydiscount-real-assets-previs.yml
  push:
    branches: [main]
    paths:
      - scripts/render_citydiscount_branded_previs.py
      - .github/workflows/citydiscount-real-assets-previs.yml
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  review-animatic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRAMA_ENABLE_PAID_GENERATION: 'NO'
      DRAMA_FACTORY_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local-only renderer and real FFmpeg
        run: |
          python -m pip install 'pillow>=11,<13'
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          if [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Recover EXISTING Owner-approved real Omni city plate (no provider call)
        uses: actions/download-artifact@v4
        with:
          name: citydiscount-s03-city-plate-not-final-episode
          run-id: 39441034483
          github-token: ${{ github.token }}
          path: artifacts/existing-real-s03
      - name: Assert source bytes and render 60s with ACTUAL repository mascot + logo
        run: |
          python scripts/render_citydiscount_branded_previs.py \
            --city-plate artifacts/existing-real-s03/s03-real/s03_city_plate.mp4 \
            --out artifacts/citydiscount-real-assets-review
          test -s artifacts/citydiscount-real-assets-review/CityDiscount_60s_real_assets_PREVIS_NOT_FINAL.mp4
          test -s artifacts/citydiscount-real-assets-review/CityDiscount_12_shot_real_assets_contact.jpg
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path("artifacts/citydiscount-real-assets-review/receipt.json")
          doc=json.loads(p.read_text("utf-8"))
          assert doc["new_external_model_calls"] == 0
          assert doc["owner_reference_pngs_sent_to_model"] == 0
          assert doc["real_ai_environment_clip"] == "s03"
          assert doc["published"] is False
          assert doc["g4_exit_approved"] is False
          assert len(doc["local_still_source_mascot_shots"]) >= 8
          assert 59.7 <= float(doc["ffprobe"]["format"]["duration"]) <= 60.3
          PY
      - name: Upload real-asset animatic MP4 + contact sheet + provenance receipt
        uses: actions/upload-artifact@v4
        with:
          name: citydiscount-60s-real-mascot-and-logo-review-NOT-FINAL
          path: |
            artifacts/citydiscount-real-assets-review/CityDiscount_60s_real_assets_PREVIS_NOT_FINAL.mp4
            artifacts/citydiscount-real-assets-review/CityDiscount_12_shot_real_assets_contact.jpg
            artifacts/citydiscount-real-assets-review/receipt.json
          retention-days: 7
          if-no-files-found: error
