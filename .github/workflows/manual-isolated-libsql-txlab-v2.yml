name: Manual isolated TxLab v2 transaction verification (LOCKED until new approval)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Future authorization only: RUN_ISOLATED_TXLAB_V2_ONE_TIME"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: drama-isolated-libsql-txlab-single-run
  cancel-in-progress: false

jobs:
  txlab-v2-one-use:
    # NEVER enable this on the basis of the old TxLab authorization.
    # Separate operator approval and a reviewed enabling PR are both required.
    if: ${{ false && github.ref == 'refs/heads/main' && inputs.confirmation == 'RUN_ISOLATED_TXLAB_V2_ONE_TIME' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install libSQL SDK
        run: python -m pip install -e '.[turso-libsql]'
      - name: Run isolated V2 canary only after new authorization
        env:
          DRAMA_TXLAB_DATABASE_URL: ${{ secrets.DRAMA_TXLAB_DATABASE_URL }}
          DRAMA_TXLAB_AUTH_TOKEN: ${{ secrets.DRAMA_TXLAB_AUTH_TOKEN }}
          DRAMA_TXLAB_V2_CONFIRM: RUN_ISOLATED_TXLAB_V2_ONE_TIME
          DRAMA_ENABLE_TXLAB_V2_WRITE: 'YES'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$DRAMA_TXLAB_DATABASE_URL" || -z "$DRAMA_TXLAB_AUTH_TOKEN" ]]; then
            echo "::error::Independent TxLab Secrets not configured; no SQL run"
            exit 1
          fi
          python -m drama_factory.storage.txlab_v2 --live
