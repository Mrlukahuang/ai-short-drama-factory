name: CityDiscount rev5 globe to exact brand logo (offline 5s)
on:
  pull_request:
    branches: [main]
    paths:
      - config/pilots/citydiscount_camera_treatment_rev5.json
      - scripts/render_citydiscount_rev5_globe_logo_previs.py
      - tests/test_citydiscount_rev5_camera_globe_logo.py
      - .github/workflows/citydiscount-rev5-globe-logo-previs.yml
  push:
    branches: [main]
    paths:
      - scripts/render_citydiscount_rev5_globe_logo_previs.py
      - .github/workflows/citydiscount-rev5-globe-logo-previs.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  render-endcard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DRAMA_ENABLE_PAID_GENERATION: 'NO'
      DRAMA_FACTORY_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local Pillow font and actual FFmpeg
        run: |
          python -m pip install 'pillow>=11,<13'
          if ! command -v ffmpeg || ! command -v ffprobe; then
            sudo apt-get update -qq && sudo apt-get install -y ffmpeg
          fi
          if [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
          fi
      - name: Render 5s felt globe spin to EXACT source logo and Owner closing copy
        run: |
          python scripts/render_citydiscount_rev5_globe_logo_previs.py \
            --out artifacts/citydiscount-rev5-globe-logo
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path("artifacts/citydiscount-rev5-globe-logo")
          receipt=json.loads((root/"receipt.json").read_text(encoding="utf-8"))
          assert receipt["schema"]=="g4-cd-rev5-globe-logo-local-previs.v1"
          assert receipt["closing_copy"]=="都市折扣🌟，您的省钱助手小羊薅薅。"
          assert receipt["output_pixels"]==[1080,1440]
          assert receipt["logo_hold_seconds"] >= 3.0
          assert 4.95 <= receipt["actual_video_seconds"] <= 5.1
          assert receipt["new_model_calls"]==0
          assert receipt["publish_approved"] is False
          assert receipt["genuine_city_to_street_zoom_verified"] is False
          assert receipt["genuine_city_to_globe_zoom_verified"] is False
          assert receipt["all_rev5_60s_footage_finished"] is False
          path=root/"CityDiscount_rev5_felt_globe_into_official_logo_5s_PREVIS_NOT_FINAL.mp4"
          assert path.exists() and path.stat().st_size>10000
          PY
      - name: Upload actual 5s brand end-card MP4 and sanitized receipt ONLY
        uses: actions/upload-artifact@v4
        with:
          name: CityDiscount-rev5-owner-globe-to-official-logo-5s-ENDCARD-NOT-FINAL
          path: |
            artifacts/citydiscount-rev5-globe-logo/CityDiscount_rev5_felt_globe_into_official_logo_5s_PREVIS_NOT_FINAL.mp4
            artifacts/citydiscount-rev5-globe-logo/receipt.json
          retention-days: 7
          if-no-files-found: error
