name: GPT real 12-shot postproduction draft (offline, no model calls)
on:
  push:
    branches: [main]
    paths:
      - "scripts/postprocess_gpt_episode_offline.py"
      - "scripts/w1_single_shot_repair.py"
      - "scripts/repair_gpt_episode_offline.py"
      - ".github/workflows/gpt-episode-postprocess-offline.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gpt-real-episode-postproduction-offline
  cancel-in-progress: false

jobs:
  postproduce-real:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline-only code and tests (no provider credentials)
        run: python -m pip install -e '.[test]'
      - name: Install hash-pinned FFmpeg + FFprobe binaries
        shell: bash
        run: |
          set -euo pipefail
          echo 'ffprobe-binaries-only==0.1.2 --hash=sha256:15b8d28d2ee159145b131450f018bf708b4910dff13a21bfa9b8e13c9309715c' > /tmp/ffmpeg-requirements.txt
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r /tmp/ffmpeg-requirements.txt
          python - <<'PY'
          import os
          from pathlib import Path
          from importlib.metadata import distribution
          dist = distribution("ffprobe-binaries-only")
          target = Path("/tmp/drama-postproduction-ffmpeg")
          target.mkdir(exist_ok=True)
          for name in ("ffmpeg", "ffprobe"):
              matches = [
                  Path(dist.locate_file(item)).resolve()
                  for item in (dist.files or []) if Path(str(item)).name == name
              ]
              matches = [file for file in matches if file.is_file()]
              if len(matches) != 1:
                  raise RuntimeError(f"Exactly one {name} binary required")
              binary = matches[0]
              binary.chmod(binary.stat().st_mode | 0o111)
              (target / name).symlink_to(binary)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as f:
              print(target, file=f)
          PY
      - name: Verify pinned FFmpeg tools after GITHUB_PATH takes effect
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version > /dev/null
          ffprobe -version > /dev/null
      - name: Verify postproduction using real FFmpeg and synthetic test media
        run: python -m pytest -q tests/test_gpt_episode_offline_postprocess.py tests/test_gpt_w1_single_shot_closed_loop.py
      - name: Download original validated writer output (read-only, no generation)
        uses: actions/download-artifact@v4
        with:
          name: writer-first3-39035812309
          run-id: 39035812309
          github-token: ${{ github.token }}
          path: artifacts/original-writer
      - name: Download original completed 12-shot material (read-only)
        uses: actions/download-artifact@v4
        with:
          name: gpt-episode-completion-39130058487
          run-id: 39130058487
          github-token: ${{ github.token }}
          path: artifacts/original-episode
      - name: Postprocess existing real clips with draft screenplay-timed captions
        run: |
          python scripts/postprocess_gpt_episode_offline.py \
            --writer-dir artifacts/original-writer \
            --episode-dir artifacts/original-episode/episode \
            --delivery-dir artifacts/original-episode/delivery \
            --output-dir artifacts/draft-postproduction
      - name: W1 simulated single-shot repair on real existing 12-shot media (no API keys)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/original-episode/episode")
          report = json.loads((root / "report.json").read_text("utf-8"))
          source = next(s for s in report["shots"] if s["shot_id"] == "s07")
          review = {"shot_id": "s07", "decision": "needs_repair",
              "reason": "existing human review: unintended triple-panel frame",
              "reviewed_by": "2026-10-19-visual-review",
              "source_video_sha256": source["video_sha256"]}
          Path("artifacts/w1-review.json").write_text(
              json.dumps(review, ensure_ascii=False), encoding="utf-8")
          PY
          python scripts/w1_single_shot_repair.py prepare \
            --writer-dir artifacts/original-writer \
            --episode-dir artifacts/original-episode/episode \
            --delivery-dir artifacts/original-episode/delivery \
            --review-file artifacts/w1-review.json \
            --output-plan artifacts/w1-plan.json
          # Deliberately use an EXISTING, DIFFERENT clip as a Fake replacement;
          # NOT a quality fix or newly generated video. New model calls = 0.
          python scripts/w1_single_shot_repair.py fake-apply \
            --writer-dir artifacts/original-writer \
            --episode-dir artifacts/original-episode/episode \
            --delivery-dir artifacts/original-episode/delivery \
            --review-file artifacts/w1-review.json \
            --plan-file artifacts/w1-plan.json \
            --replacement artifacts/original-episode/episode/s04.mp4 \
            --output-dir artifacts/w1-offline-simulation
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/w1-offline-simulation")
          result = json.loads((root / "w1-result.json").read_text("utf-8"))
          assert result["shot_id"] == "s07"
          assert result["new_paid_model_calls"] == 0
          assert result["new_provider_task_id"] is None
          assert result["technical_qa_passed"] is True
          assert result["content_qa_passed"] is False
          assert result["publish_approved"] is False
          assert len(result["unchanged_shots_sha256"]) == 11
          PY
      - name: Verify W3 measured timeline and exact W1 parent provenance (read-only media)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/postprocess_gpt_episode_offline.py \
            --writer-dir artifacts/original-writer \
            --episode-dir artifacts/w1-offline-simulation/repair/episode \
            --delivery-dir artifacts/w1-offline-simulation/repair/delivery \
            --parent-episode-dir artifacts/original-episode/episode \
            --parent-delivery-dir artifacts/original-episode/delivery \
            --output-dir artifacts/w3-repaired-provenance
          python - <<'PY'
          import json
          from pathlib import Path
          roots = [Path("artifacts/draft-postproduction"),
                   Path("artifacts/w3-repaired-provenance")]
          for folder, expected in zip(roots, ["original_completed_episode",
                                                "operator_existing_media_offline_simulation"]):
              receipt = json.loads((folder / "09_render.json").read_text("utf-8"))
              qa = json.loads((folder / "10_qa.json").read_text("utf-8"))
              assert receipt["repair"]["replacement_mode"] == expected
              assert len(receipt["shots"]) == 12
              assert receipt["shots"][-1]["end_ms"] == receipt["measured_shot_total_ms"]
              assert qa["render_receipt_sha256"]
              assert qa["technical_decode_passed"] is True
              assert qa["publish_approved"] is False
              assert qa["asset_manifest_sha256"] is None
              assert qa["production_assets_verified"] is False
          assert json.loads((roots[1] / "09_render.json").read_text("utf-8"))[
              "repair"]["parent_source_crosschecked"] is True
          PY
      - name: Upload explicitly marked W1 Fake repair evidence
        uses: actions/upload-artifact@v4
        with:
          name: gpt-W1-FAKE-single-shot-repair-${{ github.run_id }}
          path: |
            artifacts/w1-plan.json
            artifacts/w1-review.json
            artifacts/w1-offline-simulation/
          if-no-files-found: error
          retention-days: 14
      - name: Upload W3 independently versioned offline repaired MP4 and SHA provenance
        uses: actions/upload-artifact@v4
        with:
          name: gpt-W3-repaired-provenance-${{ github.run_id }}
          path: artifacts/w3-repaired-provenance/
          if-no-files-found: error
          retention-days: 14
      - name: Upload draft MP4, SRT, real-audio preservation and explicit QA receipts
        uses: actions/upload-artifact@v4
        with:
          name: gpt-real-12shot-caption-DRAFT-${{ github.run_id }}
          path: artifacts/draft-postproduction/
          if-no-files-found: error
          retention-days: 14
