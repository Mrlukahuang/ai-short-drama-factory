name: Python CI (offline, no paid models)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Run tests (offline)
        env:
          DRAMA_FACTORY_OFFLINE: '1'
        run: pytest -q
      - name: Compile source
        run: python -m compileall -q src

  offline-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hash-pinned FFmpeg/FFprobe binaries from PyPI
        shell: bash
        run: |
          echo 'ffprobe-binaries-only==0.1.2 --hash=sha256:15b8d28d2ee159145b131450f018bf708b4910dff13a21bfa9b8e13c9309715c' > /tmp/ffmpeg-requirements.txt
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r /tmp/ffmpeg-requirements.txt
          python - <<'PY'
          import os
          from pathlib import Path
          from ffprobe_binaries import get_ffmpeg_path, get_ffprobe_path
          target = Path("/tmp/shortdrama-ffmpeg")
          target.mkdir(exist_ok=True)
          for name, source in (("ffmpeg", get_ffmpeg_path()), ("ffprobe", get_ffprobe_path())):
              binary = Path(source).resolve()
              if not binary.is_file():
                  raise RuntimeError(f"Missing bundled {name} binary")
              binary.chmod(binary.stat().st_mode | 0o111)
              (target / name).symlink_to(binary)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              print(target, file=handle)
          PY
      - name: Verify FFmpeg tools
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version > /dev/null
          ffprobe -version > /dev/null
      - name: Install offline dependencies
        run: python -m pip install -e '.[test]'
      - name: Enforce all FFmpeg integration tests (cannot skip)
        env:
          DRAMA_FACTORY_OFFLINE: '1'
        run: |
          pytest -q tests/test_offline_render.py tests/test_media_ingest.py tests/test_google_omni_video.py -rs
          python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
      - name: Create playable 6-second MP4 (no API keys)
        env:
          DRAMA_FACTORY_OFFLINE: '1'
        run: python -m drama_factory.pipeline.offline_demo --out artifacts/offline-demo
      - name: Verify output streams and duration
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,width,height -of json artifacts/offline-demo/demo.mp4
          test -s artifacts/offline-demo/manifest.json
      - name: Upload free demo MP4 and manifest
        uses: actions/upload-artifact@v4
        with:
          name: offline-end-to-end-mp4
          path: |
            artifacts/offline-demo/demo.mp4
            artifacts/offline-demo/manifest.json
          retention-days: 7
          if-no-files-found: error
