name: Python CI (offline, no paid models)
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read

# Keep the newest check for each PR; every main commit keeps its own run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[test]'
      - name: Run tests (offline)
        env:
          DRAMA_FACTORY_OFFLINE: '1'
        run: pytest -q
      - name: Compile source
        run: python -m compileall -q src

  libsql-sdk-local:
    name: Real libSQL Python SDK — local-only contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # This job has NO cloud Secrets and does not use a network DB URL.
    # Pin exactly the SDK used by the authorized real TxLab 0.1.11 runs.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real pinned libSQL SDK and offline test dependencies
        run: |
          python -m pip install -e '.[test]'
          python -m pip install 'libsql==0.1.11'
      - name: Verify installed SDK and enforce dedicated local contract tests
        env:
          DRAMA_FACTORY_OFFLINE: '1'
          DRAMA_TXLAB_DATABASE_URL: ''
          DRAMA_TXLAB_AUTH_TOKEN: ''
        run: |
          python -c "import libsql; import importlib.metadata as m; assert m.version('libsql') == '0.1.11'"
          pytest -q tests/test_libsql_sdk_local_only.py tests/test_real_ledger_libsql_sdk_local.py tests/test_libsql_sdk_local_ledger_adapter.py tests/test_libsql_sdk_local_concurrency.py tests/test_pr31_offline_recovery_native_sdk.py tests/test_pr31_native_fenced_job_lab.py tests/test_pr31_native_fenced_intent_lab.py tests/test_pr31_native_synthetic_task_lab.py tests/test_txlab_v4_native_sdk_local.py tests/test_pr31_native_multiprocess_fencing.py tests/test_pr31_offline_writer_quiescence.py tests/test_pr31_v5_offline_native_schedule.py tests/test_txlab_v5_native_sdk_local.py -rs

  offline-video:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hash-pinned FFmpeg/FFprobe binaries from PyPI
        shell: bash
        run: |
          echo 'ffprobe-binaries-only==0.1.2 --hash=sha256:15b8d28d2ee159145b131450f018bf708b4910dff13a21bfa9b8e13c9309715c' > /tmp/ffmpeg-requirements.txt
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r /tmp/ffmpeg-requirements.txt
          python - <<'PY'
          import os
          from pathlib import Path
          from importlib.metadata import distribution
          dist = distribution("ffprobe-binaries-only")
          target = Path("/tmp/shortdrama-ffmpeg")
          target.mkdir(exist_ok=True)
          for name in ("ffmpeg", "ffprobe"):
              matches = [
                  Path(dist.locate_file(part)).resolve()
                  for part in (dist.files or [])
                  if Path(str(part)).name == name
              ]
              matches = [p for p in matches if p.is_file()]
              if len(matches) != 1:
                  raise RuntimeError(f"Expected one bundled {name} binary; found {matches}")
              binary = matches[0]
              binary.chmod(binary.stat().st_mode | 0o111)
              (target / name).symlink_to(binary)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              print(target, file=handle)
          PY
      - name: Verify FFmpeg tools
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version > /dev/null
          ffprobe -version > /dev/null
      - name: Install offline dependencies
        run: python -m pip install -e '.[test]'
      - name: Enforce all FFmpeg integration tests (cannot skip)
        env:
          DRAMA_FACTORY_OFFLINE: '1'
        run: |
          pytest -q tests/test_offline_render.py tests/test_offline_qa.py tests/test_offline_audio_mix.py tests/test_dialogue_audio_provider.py tests/test_offline_dialogue_timeline.py tests/test_offline_cast_timeline.py tests/test_offline_cue_timing.py tests/test_offline_subtitle_alignment.py tests/test_muxed_subtitle_attestation.py tests/test_gemini_tts_contract.py tests/test_tts_persistent_ledger.py tests/test_tts_receipt_tampering.py tests/test_media_ingest.py tests/test_google_omni_video.py tests/test_offline_workers.py tests/test_google_recovery.py tests/test_artifact_storage.py tests/test_cloud_objects.py tests/test_cloud_canary.py tests/test_drive_objects.py tests/test_drive_canary.py tests/test_turso_receipts.py tests/test_turso_canary.py -rs
          python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
      - name: Enforce G4 two-series shared Fake worker real FFmpeg E2E
        env:
          DRAMA_FACTORY_OFFLINE: '1'
          DRAMA_ENABLE_PAID_GENERATION: 'NO'
        run: |
          python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe'), 'Real ffmpeg/ffprobe required'"
          pytest -q tests/test_g4_generic_two_series_real_offline_e2e.py -rs

      - name: Create playable 6-second MP4 (no API keys)
        env:
          DRAMA_FACTORY_OFFLINE: '1'
        run: python -m drama_factory.pipeline.offline_demo --out artifacts/offline-demo
      - name: Verify output streams and duration
        run: |
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,width,height -of json artifacts/offline-demo/demo.mp4
          test -s artifacts/offline-demo/manifest.json
      - name: Upload free demo MP4 and manifest
        uses: actions/upload-artifact@v4
        with:
          name: offline-end-to-end-mp4
          path: |
            artifacts/offline-demo/demo.mp4
            artifacts/offline-demo/manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: Render complete 60-second vertical OFFLINE technical sample
        env:
          DRAMA_FACTORY_OFFLINE: '1'
        run: python -m drama_factory.pipeline.offline_demo --seconds 60 --out artifacts/offline-demo-60
      - name: Enforce 60-second full-chain QA and no paid/provider claims
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/offline-demo-60")
          doc = json.loads((root / "manifest.json").read_text("utf-8"))
          actual = root / "demo.mp4"
          assert actual.is_file() and actual.stat().st_size > 1000
          assert doc["media"]["duration_seconds"] >= 59.4
          assert doc["media"]["duration_seconds"] <= 60.6
          assert doc["media"]["width"] == 360 and doc["media"]["height"] == 640
          assert doc["media"]["video_codec"] == "h264"
          assert doc["media"]["audio_codec"] == "aac"
          assert doc["media"]["subtitle_codec"] == "mov_text"
          assert doc["technical_qa"]["technical_decode_passed"] is True
          assert doc["technical_qa"]["subtitle_sidecar_timing_passed"] is True
          assert doc["technical_qa"]["muxed_subtitle_content_verified"] is True
          assert doc["technical_qa"]["muxed_subtitle_cues_checked"] == len(doc["subtitle_schedule"])
          assert doc["technical_qa"]["shots_checked"] == 3
          assert doc["technical_qa"]["operator_review_required"] is True
          assert doc["technical_qa"]["publish_approved"] is False
          assert doc["technical_qa"]["production_ready"] is False
          assert doc["technical_qa"]["genuine_ai_video_verified"] is False
          assert doc["paid_api_calls"] == 0
          assert doc["spoken_dialogue_generated"] is False
          assert doc["supplied_local_clips"] == 1
          assert len(doc["shots"]) == 3
          assert sum(s["duration_seconds"] for s in doc["shots"]) == 60
          PY
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,width,height -of json artifacts/offline-demo-60/demo.mp4
      - name: Upload full-minute offline technical delivery (not AI footage)
        uses: actions/upload-artifact@v4
        with:
          name: offline-one-minute-technical-mp4
          path: |
            artifacts/offline-demo-60/demo.mp4
            artifacts/offline-demo-60/manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: Render real 60-second MP4 with TWO synthetic PCM audio stems
        env:
          DRAMA_FACTORY_OFFLINE: '1'
        run: |
          python -m drama_factory.pipeline.offline_demo --seconds 60 --synthetic-audio-mix --out artifacts/offline-demo-60-mixed
      - name: Verify actual two-stem AAC mux, subtitle track and no claims of real TTS
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/offline-demo-60-mixed")
          doc = json.loads((root / "manifest.json").read_text("utf-8"))
          assert (root / "demo.mp4").is_file()
          assert 59.4 <= doc["media"]["duration_seconds"] <= 60.6
          assert doc["media"]["video_codec"] == "h264"
          assert doc["media"]["audio_codec"] == "aac"
          assert doc["media"]["subtitle_codec"] == "mov_text"
          assert len(doc["shots"]) == 3
          assert sum(s["duration_seconds"] for s in doc["shots"]) == 60
          assert doc["synthetic_test_tone_stems"] is True
          assert doc["local_dialogue_audio_supplied"] is True
          assert doc["local_music_audio_supplied"] is True
          assert doc["spoken_dialogue_generated"] is False
          assert doc["voice_license_independently_verified"] is False
          assert doc["offline_audio_mix"]["real_tts_generated"] is False
          assert doc["offline_audio_mix"]["subtitle_track_preserved"] is True
          assert doc["technical_qa"]["technical_decode_passed"] is True
          assert doc["technical_qa"]["subtitle_sidecar_timing_passed"] is True
          assert doc["technical_qa"]["muxed_subtitle_content_verified"] is True
          assert doc["technical_qa"]["muxed_subtitle_cues_checked"] == len(doc["subtitle_schedule"])
          assert doc["technical_qa"]["publish_approved"] is False
          assert doc["technical_qa"]["production_ready"] is False
          assert doc["technical_qa"]["genuine_ai_video_verified"] is False
          assert doc["paid_api_calls"] == 0
          PY
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,width,height -of json artifacts/offline-demo-60-mixed/demo.mp4
      - name: Upload 60s two-tone audio mix technical MP4 (NO real dialogue)
        uses: actions/upload-artifact@v4
        with:
          name: offline-one-minute-two-tone-audio-mix
          path: |
            artifacts/offline-demo-60-mixed/demo.mp4
            artifacts/offline-demo-60-mixed/manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: Render actual 60-second approved FakeVoice shot timeline with local music
        env:
          DRAMA_FACTORY_OFFLINE: '1'
        run: |
          python -m drama_factory.pipeline.offline_demo --seconds 60 --fake-voice-timeline --out artifacts/offline-demo-60-fake-voice
      - name: Verify three different approved shot FakeWAVs composed into one 60s soundtrack
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/offline-demo-60-fake-voice")
          doc = json.loads((root / "manifest.json").read_text("utf-8"))
          assert (root / "demo.mp4").is_file()
          assert doc["fake_voice_timeline"] is True
          assert doc["fake_voice_shots"] == 3
          assert doc["synthetic_test_tone_stems"] is False
          assert doc["real_tts_generated"] is False
          assert doc["spoken_dialogue_generated"] is False
          assert doc["voice_license_independently_verified"] is False
          assert doc["offline_audio_mix"]["locally_supplied_dialogue"] is True
          assert doc["offline_audio_mix"]["locally_supplied_music"] is True
          assert 59.4 <= doc["media"]["duration_seconds"] <= 60.6
          assert doc["media"]["video_codec"] == "h264"
          assert doc["media"]["audio_codec"] == "aac"
          assert doc["media"]["subtitle_codec"] == "mov_text"
          assert doc["technical_qa"]["technical_decode_passed"] is True
          assert doc["technical_qa"]["subtitle_sidecar_timing_passed"] is True
          assert doc["technical_qa"]["muxed_subtitle_content_verified"] is True
          assert doc["technical_qa"]["muxed_subtitle_cues_checked"] == len(doc["subtitle_schedule"])
          assert doc["technical_qa"]["publish_approved"] is False
          assert doc["technical_qa"]["production_ready"] is False
          assert doc["paid_api_calls"] == 0
          PY
      - name: Upload FakeVoice approved-script 60s local MP4 (NOT TTS)
        uses: actions/upload-artifact@v4
        with:
          name: offline-one-minute-fake-voice-script-timeline
          path: |
            artifacts/offline-demo-60-fake-voice/demo.mp4
            artifacts/offline-demo-60-fake-voice/manifest.json
          retention-days: 7
          if-no-files-found: error

      - name: Render 60s approved two-actor multi-cue WAV timeline into actual MP4
        env:
          DRAMA_FACTORY_OFFLINE: '1'
        run: |
          python -m drama_factory.pipeline.offline_demo --seconds 60 --fake-cast-timeline --out artifacts/offline-demo-60-fake-cast
      - name: Confirm two distinct approved actors, three cue slots, silent shot and release gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("artifacts/offline-demo-60-fake-cast")
          data = json.loads((root / "manifest.json").read_text("utf-8"))
          assert (root / "demo.mp4").is_file()
          assert data["fake_cast_timeline"] is True
          assert data["fake_cast_actors"] == 2
          assert data["fake_cast_cues"] == 3
          assert [(s["start_second"], s["end_second"]) for s in data["subtitle_schedule"]] == [
              (1,10), (11,19), (22,39), (40,60)
          ]
          assert data["technical_qa"]["approved_subtitle_schedule_verified"] is True
          assert data["technical_qa"]["subtitle_cues_checked"] == 4
          # Independent 48 kHz source PCM check: final 60s includes
          # reviewer-approved silence at onset, between lines and shot 3.
          import hashlib, wave
          tracks = list((root / "fake-cast").glob("fake-structured-cast-*.wav"))
          assert len(tracks) == 1
          assert hashlib.sha256(tracks[0].read_bytes()).hexdigest() == data["offline_audio_mix"]["dialogue_sha256"]
          with wave.open(str(tracks[0]), "rb") as pcm:
              assert pcm.getframerate() == 48000
              assert pcm.getnchannels() == 1
              assert pcm.getnframes() == 60 * 48000
              samples = pcm.readframes(pcm.getnframes())
          def region(a, b):
              return samples[a*48000*2:b*48000*2]
          assert region(0, 1) == b"\x00" * (48000*2)
          assert any(region(1, 10))
          assert region(10, 11) == b"\x00" * (48000*2)
          assert any(region(11, 19))
          assert region(19, 22) == b"\x00" * (3*48000*2)
          assert any(region(22, 39))
          assert region(39, 60) == b"\x00" * (21*48000*2)
          assert data["fake_voice_timeline"] is False
          assert len(data["shots"]) == 3
          assert 59.4 <= data["media"]["duration_seconds"] <= 60.6
          assert data["media"]["video_codec"] == "h264"
          assert data["media"]["audio_codec"] == "aac"
          assert data["media"]["subtitle_codec"] == "mov_text"
          assert data["offline_audio_mix"]["locally_supplied_dialogue"] is True
          assert data["offline_audio_mix"]["locally_supplied_music"] is True
          assert data["technical_qa"]["technical_decode_passed"] is True
          assert data["technical_qa"]["subtitle_sidecar_timing_passed"] is True
          assert data["technical_qa"]["muxed_subtitle_content_verified"] is True
          assert data["technical_qa"]["muxed_subtitle_cues_checked"] == len(data["subtitle_schedule"])
          assert data["technical_qa"]["publish_approved"] is False
          assert data["technical_qa"]["production_ready"] is False
          assert data["voice_license_independently_verified"] is False
          assert data["spoken_dialogue_generated"] is False
          assert data["real_tts_generated"] is False
          assert data["paid_api_calls"] == 0
          PY
          ffprobe -v error -show_entries format=duration:stream=codec_type,codec_name,width,height -of json artifacts/offline-demo-60-fake-cast/demo.mp4
      - name: Upload approved-cast 60s fake dialogue MP4 (synthetic tones ONLY)
        uses: actions/upload-artifact@v4
        with:
          name: offline-one-minute-two-actor-fake-cues
          path: |
            artifacts/offline-demo-60-fake-cast/demo.mp4
            artifacts/offline-demo-60-fake-cast/manifest.json
          retention-days: 7
          if-no-files-found: error
