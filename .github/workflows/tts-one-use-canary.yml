name: One-use fictional Gemini TTS canary — original short phrase only

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tts-one-use-canary.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: drama-paid-tts-one-original-phrase
  cancel-in-progress: false

jobs:
  exactly-one-original-tts:
    name: Original short synthetic-language TTS canary (at most one API request)
    if: ${{ github.ref == 'refs/heads/main' && github.run_attempt == 1 && contains(github.event.head_commit.message, 'PR10-ONE-REAL-TTS-20261014') }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prove single source merge before accessing any paid Provider credentials
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" && "$GITHUB_RUN_ATTEMPT" == "1" ]]
          git show -s --format=%B "$GITHUB_SHA" | grep -Fq "PR10-ONE-REAL-TTS-20261014"
          historical=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tts-one-use-canary.yml/runs?event=push&per_page=100" \
            --jq ".workflow_runs | map(select(.head_sha == \"$GITHUB_SHA\")) | length")
          if [[ "$historical" != "1" ]]; then
            echo "::error::A TTS canary run for this merge already exists or history is ambiguous"
            exit 1
          fi
      - name: Install vetted Google Interactions TTS SDK (no model call)
        run: python -m pip install -e '.[google-tts]'
      - name: Confirm private API secret is set without printing it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$GEMINI_API_KEY" ]]; then
            echo "::error::Private GEMINI_API_KEY is absent; no paid TTS attempted"
            exit 1
          fi
      - name: Generate ONE original fictional short phrase, never retry on unknown ACK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRAMA_ENABLE_PAID_GENERATION: 'YES'
          DRAMA_TTS_CANARY_CONFIRM: RUN_FICTIONAL_TTS_ONLY_ONCE
          DRAMA_TTS_CANARY_MAX_USD: '2.00'
        run: |
          set -euo pipefail
          python -m drama_factory.providers.tts_canary
      - name: Upload validated private WAV (not from user or real actor)
        uses: actions/upload-artifact@v4
        with:
          name: single-original-gemini-tts-wav
          path: artifacts/original-one-use-tts.wav
          retention-days: 3
          if-no-files-found: error
