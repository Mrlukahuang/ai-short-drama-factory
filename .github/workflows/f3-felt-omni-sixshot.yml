name: F3 Felt Omni 6-shot full episode (manual, owner gated)
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN_F3_FELT_OMNI_6 (budget preflight runs before any API request)"
        required: true
        type: string
      reported_spend_today_usd:
        description: "Google billing USD already spent TODAY; verify first, do not guess"
        required: true
        type: string

permissions:
  contents: read
  issues: write
concurrency:
  group: owner-f3-felt-six-shot
  cancel-in-progress: false

jobs:
  felt-omni-six:
    if: ${{ inputs.confirmation == 'RUN_F3_FELT_OMNI_6' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DRAMA_FACTORY_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -e '.[test,google-video]'
      - name: Install hash-pinned FFmpeg and FFprobe binaries (same as offline CI)
        shell: bash
        run: |
          set -euo pipefail
          echo 'ffprobe-binaries-only==0.1.2 --hash=sha256:15b8d28d2ee159145b131450f018bf708b4910dff13a21bfa9b8e13c9309715c' > /tmp/f3-ffmpeg-requirements.txt
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r /tmp/f3-ffmpeg-requirements.txt
          python - <<'PY'
          import os
          from pathlib import Path
          from importlib.metadata import distribution

          dist = distribution("ffprobe-binaries-only")
          target = Path("/tmp/shortdrama-f3-ffmpeg")
          target.mkdir(exist_ok=True)
          for name in ("ffmpeg", "ffprobe"):
              matches = [
                  Path(dist.locate_file(part)).resolve()
                  for part in (dist.files or [])
                  if Path(str(part)).name == name
              ]
              matches = [p for p in matches if p.is_file()]
              if len(matches) != 1:
                  raise RuntimeError(f"Expected one bundled {name} binary; found {matches}")
              binary = matches[0]
              binary.chmod(binary.stat().st_mode | 0o111)
              (target / name).symlink_to(binary)
          with open(os.environ["GITHUB_PATH"], "a", encoding="utf-8") as handle:
              print(target, file=handle)
          PY
      - name: Verify pinned FFmpeg tools
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version > /dev/null
          ffprobe -version > /dev/null
      - name: Enforce one-time owner USD2.50 + daily USD5 envelope BEFORE secret
        env:
          SPEND_TODAY_USD: ${{ inputs.reported_spend_today_usd }}
        run: |
          python scripts/f3_omni_report.py --preflight --owner-approved-f3-137 \
            --reported-spend-today-usd "$SPEND_TODAY_USD" \
            --out artifacts/f3/preflight.json
      - name: Require existing Gemini API secret, but do not print it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: test -n "$GEMINI_API_KEY"
      - name: Reserve F3 paid run on Issue #137 to prevent all later duplicate calls
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/f3_one_time_claim.py
      - name: Generate exactly six 360p portrait clips with native audio
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRAMA_ENABLE_PAID_GENERATION: 'YES'
          SPEND_TODAY_USD: ${{ inputs.reported_spend_today_usd }}
        run: |
          python scripts/fake_episode.py tests/fixtures/felt_episode_synopsis.txt \
            --output-dir artifacts/f3/work --duration 60 \
            --acknowledge-fake-approvals \
            --provider omni --style felt_diorama --paid \
            --owner-approved-f3-137 --reported-spend-today-usd "$SPEND_TODAY_USD"
      - name: Validate each shot and the final real MP4
        run: |
          run_dir="$(find artifacts/f3/work -name episode.omni.mp4 -type f -printf '%h\n' -quit)"
          test -n "$run_dir"
          python scripts/f3_omni_report.py --run-dir "$run_dir" \
            --out "$run_dir/manifest.json"
          ffprobe -v error -show_entries format=duration:stream=codec_type,width,height \
            -of json "$run_dir/episode.omni.mp4" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload only a verified genuine clip bundle
        uses: actions/upload-artifact@v4
        with:
          name: f3-felt-omni-sixshot-real-mp4
          path: |
            artifacts/f3/work/omni-*/episode.omni.mp4
            artifacts/f3/work/omni-*/*.task.json
            artifacts/f3/work/omni-*/[0-1][0-9]_*.json
            artifacts/f3/work/omni-*/manifest.json
          if-no-files-found: error
          retention-days: 14
