[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ai-short-drama-factory"
version = "0.1.0"
description = "Backend-first AI drama factory with a separate novel-adaptation intake"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9",
]
[project.optional-dependencies]
readers = ["python-docx>=1.1", "pymupdf>=1.24"]
frontend = ["streamlit>=1.38", "requests>=2.32"]
test = ["pytest>=8", "httpx>=0.27", "python-docx>=1.1", "pymupdf>=1.24"]

[project.scripts]
drama-factory-api = "drama_factory.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/drama_factory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
